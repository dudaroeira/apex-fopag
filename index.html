<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recursos Humanos · Grupo Apex</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3864">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recursos Humanos">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1F3864;--blue:#2E75B6;--green:#1D9E75;--red:#E24B4A;--amber:#BA7517;
--bg:#F4F6F9;--card:#FFFFFF;--line:#E3E8F0;--txt:#1B2433;--mut:#6B7686;--mut2:#9AA4B2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
header{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:10;}
.topbar{display:flex;justify-content:space-between;align-items:center;}
.topbar .brand{font-size:12px;letter-spacing:.5px;opacity:.85;}
.topbar .who{font-size:10px;opacity:.7;margin-top:2px;}
.topbar .menu{background:rgba(255,255,255,.14);border:none;color:#fff;width:32px;height:32px;border-radius:9px;font-size:17px;cursor:pointer;}
.navdate{display:flex;align-items:center;gap:8px;margin-top:11px;}
.navdate .arrow{background:rgba(255,255,255,.14);border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer;flex:none;}
.navdate .arrow:disabled{opacity:.35;}
.navdate select{flex:1;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:8px 10px;font-size:14px;font-weight:600;text-align:center;text-align-last:center;}
.navdate select option{color:#000;}
.entpills{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 0;background:var(--bg);scrollbar-width:none;}
.entpills::-webkit-scrollbar{display:none;}
.entpills span{font-size:12px;padding:7px 14px;border-radius:18px;border:1px solid var(--line);color:var(--mut);background:var(--card);cursor:pointer;white-space:nowrap;font-weight:500;}
.entpills span.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600;}
main{flex:1;padding:16px 16px 90px;}
h1{font-size:18px;font-weight:600;margin-bottom:4px;}
.subtitle{color:var(--mut);font-size:13px;margin-bottom:14px;}
.kpi{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;border:1px solid var(--line);}
.kpi .lbl{font-size:13px;color:var(--mut);}
.kpi .big{font-size:26px;font-weight:600;margin-top:3px;}
.kpi .big.sm{font-size:20px;}
.kpi .delta{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px;}
.kpi .ext{font-size:11px;color:var(--mut);margin-top:3px;}
.up{color:var(--green);}.down{color:var(--red);}.flat{color:var(--mut);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}.row2 .kpi{margin-bottom:0;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}.row3 .kpi{margin-bottom:0;padding:12px;}.row3 .kpi .big{font-size:18px;}.row3 .kpi .lbl{font-size:11px;}
.sect{font-size:13px;color:var(--mut);margin:18px 0 8px;font-weight:600;}
.card{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line);margin-bottom:10px;}
.toggle{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.toggle span{font-size:12px;padding:6px 13px;border-radius:16px;border:1px solid var(--line);color:var(--mut);cursor:pointer;background:var(--card);user-select:none;}
.toggle span.on{background:#E6EEF8;color:var(--blue);border-color:#C3D6EE;font-weight:600;}
.line{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
.line:last-child{border-bottom:none;}.line .v{color:var(--mut);}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start;}
.alert.r{background:#FBE9E9;border:1px solid #F5C7C6;color:#7E1F1E;}
.alert.y{background:#FDF3DD;border:1px solid #F1DBA1;color:#7B5A14;}
.alert.g{background:#E2F2EA;border:1px solid #BFE0CB;color:#185F3F;}
.alert .ic{font-size:18px;flex:none;}
.alert .t{font-size:13px;font-weight:600;}
.alert .m{font-size:12px;margin-top:2px;line-height:1.45;}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:30px 10px;}
.list-it{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px;}
.list-it:last-child{border-bottom:none;}
.list-it .lt{flex:1;min-width:0;}
.list-it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-it .s{font-size:11px;color:var(--mut);margin-top:1px;}
.list-it .r{text-align:right;flex:none;font-size:13px;}
.list-it .r small{display:block;font-size:11px;color:var(--mut);margin-top:1px;}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--mut);}
.bar-lbl b{font-weight:600;color:var(--txt);}
.bar{height:11px;border-radius:6px;margin-bottom:13px;min-width:6px;}
.semaforo{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;height:64px;z-index:20;}
nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut2);font-size:11px;cursor:pointer;padding:0;}
nav button.on{color:var(--blue);}nav button svg{width:22px;height:22px;}
.fab{position:fixed;bottom:78px;left:50%;transform:translateX(calc(-50% + 150px));background:var(--blue);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:26px;box-shadow:0 4px 14px rgba(46,117,182,.4);z-index:21;cursor:pointer;}
.modal{position:fixed;inset:0;background:rgba(20,28,42,.5);z-index:30;display:none;align-items:flex-end;justify-content:center;}
.modal.on{display:flex;}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px 28px;max-height:88vh;overflow:auto;}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:4px;}
.sheet p.hint{font-size:12px;color:var(--mut);margin-bottom:16px;line-height:1.5;}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px;cursor:pointer;}
.btns{display:flex;gap:10px;margin-top:18px;}
.btns button{flex:1;padding:13px;border-radius:11px;font-size:14px;font-weight:600;border:none;cursor:pointer;}
.btn-p{background:var(--blue);color:#fff;}.btn-s{background:#EDF0F5;color:var(--txt);}
.note{font-size:11px;color:var(--mut2);text-align:center;margin-top:14px;line-height:1.5;}
canvas{max-width:100%;}
.bigbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;cursor:pointer;margin-bottom:10px;text-align:left;color:var(--txt);}
.bigbtn b{font-weight:600;}.bigbtn small{display:block;color:var(--mut);font-size:11px;margin-top:2px;}
.bigbtn .ic{width:36px;height:36px;border-radius:9px;background:#E6EEF8;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.msect{font-size:12px;color:var(--mut);font-weight:600;margin:18px 0 8px;}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:6px;}
.badge.mgr{background:#E1F0E9;color:#0F6E56;}.badge.view{background:#E6EEF8;color:#185FA5;}
.quartil{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:8px;}
.quartil .q{flex:1;background:#E6EEF8;border-radius:4px 4px 0 0;position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:2px;}
.quartil .q b{font-size:10px;color:var(--blue);font-weight:600;}
.quartil .q.m{background:var(--blue);} .quartil .q.m b{color:#fff;}
#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
#login .box{width:100%;max-width:360px;}
#login .logo{text-align:center;margin-bottom:22px;}
#login .logo .b1{color:var(--navy);font-size:22px;font-weight:700;}
#login .logo .b2{color:var(--mut);font-size:13px;margin-top:2px;}
#login label{font-size:12px;color:var(--mut);display:block;margin:12px 0 4px;}
#login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;}
#login button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:600;margin-top:18px;cursor:pointer;}
#login .err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:18px;}
.hidden{display:none!important;}
.action-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.action-row button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--blue);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
@media (min-width:860px){
  body{background:var(--bg);}
  #app{max-width:1040px;min-height:auto;margin:22px auto;border:1px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;}
  header{order:1;border-radius:16px 16px 0 0;}
  .entpills{order:2;background:var(--card);padding:14px 30px 0;}
  nav{order:3;position:static;transform:none;left:auto;width:100%;max-width:none;height:auto;border-top:none;border-bottom:1px solid var(--line);justify-content:center;gap:10px;padding:8px;}
  nav button{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 20px;font-size:14px;border-radius:10px;}
  nav button.on{background:#E6EEF8;}
  nav button svg{width:18px;height:18px;}
  main{order:4;padding:26px 30px 34px;}
  .fab{order:5;position:fixed;left:auto;right:30px;bottom:30px;transform:none;width:56px;height:56px;}
  h1{font-size:22px;}
  .kpi{padding:20px;}
  .kpi .big{font-size:30px;}
  .row2{grid-template-columns:1fr 1fr;gap:16px;}
  .row3{grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .card{padding:18px 20px;}
  .modal{align-items:center;}
  .sheet{max-width:560px;border-radius:18px;max-height:86vh;}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo"><div class="b1">Recursos Humanos</div><div class="b2">Grupo Apex · Folha de pagamento</div></div>
    <label>E-mail</label><input id="li_email" type="email" autocomplete="username" placeholder="seu@apexengenharia.com.br">
    <label>Senha</label><input id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="li_err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="topbar">
      <div><div class="brand">APEX ENGENHARIA · RECURSOS HUMANOS</div><div class="who" id="who"></div></div>
      <button class="menu" onclick="openMenu()" aria-label="Menu">&#9776;</button>
    </div>
    <div class="navdate">
      <button class="arrow" id="prev" onclick="step(-1)" aria-label="Anterior">&#9664;</button>
      <select id="mesSel" onchange="selectMes(this.value)"></select>
      <button class="arrow" id="next" onclick="step(1)" aria-label="Próximo">&#9654;</button>
    </div>
  </header>
  <div class="entpills" id="entPills"></div>
  <main id="main"></main>
  <button class="fab hidden" id="fab" onclick="openUpload()" aria-label="Carregar folha">+</button>
  <nav id="nav">
    <button data-t="painel" class="on" onclick="go('painel')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Painel</button>
    <button data-t="evolucao" onclick="go('evolucao')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Evolução</button>
    <button data-t="equipe" onclick="go('equipe')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 21c0-3 2-4.5 4.5-4.5"/></svg>Equipe</button>
    <button data-t="fit" onclick="go('fit')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7-6.5-4.5L5.5 20l2-7L2 9h7z"/></svg>FIT</button>
  </nav>
</div>

<div class="modal" id="upload"><div class="sheet">
  <h2>Carregar folha do mês</h2>
  <p class="hint">Selecione um ou vários XLS analíticos (.xls/.xlsx) do sistema do escritório.</p>
  <div class="drop" id="drop" onclick="document.getElementById('xlsfile').click()"><div id="dropTxt">Toque para escolher arquivos XLS<br><span style="font-size:11px;color:var(--mut2)">Múltiplos arquivos suportados</span></div></div>
  <input type="file" id="xlsfile" accept=".xlsx,.xls" multiple style="display:none" onchange="onUpload(event)">
  <div id="uploadStatus"></div>
  <div class="btns"><button class="btn-s" onclick="closeUpload()">Fechar</button></div>
</div></div>

<div class="modal" id="menu"><div class="sheet">
  <h2>Mais</h2>
  <div class="msect">CONTA</div>
  <div id="menuWho" class="card" style="margin-bottom:14px;"></div>
  <button class="bigbtn" onclick="exportarPDFPainel()"><span class="ic">&#128196;</span><span><b>PDF do painel</b><small>KPIs e tabelas do escopo atual</small></span></button>
  <button class="bigbtn" onclick="exportarPDFEquipe()"><span class="ic">&#128101;</span><span><b>PDF da equipe</b><small>Relação completa filtrada pelo escopo</small></span></button>
  <button class="bigbtn" onclick="doLogout()"><span class="ic">&#8617;</span><span><b>Sair</b><small>Encerra a sessão neste dispositivo</small></span></button>
  <div class="note">Apex Engenharia · v0.2</div>
</div></div>

<script>
// ===== CONFIG =====
const SB_URL  = 'https://lthoecbhepjhjftvzhcc.supabase.co';
const SB_ANON = 'sb_publishable_6sVFdxk55-eX_wzgDOOb9Q_b4Qng_bt';
const MANAGER_EMAIL = 'eduardo@apexengenharia.com.br';

const sb = supabase.createClient(SB_URL, SB_ANON, { db: { schema: 'apex_fopag' } });

// ===== STATE =====
let TAB = 'painel';
let USER = null;
let IS_MANAGER = false;
let MESES = [];        // ['2026-05', '2026-04', ...]
let MES = null;        // mês atualmente selecionado
let ENTIDADE = 'APEX'; // 'APEX' | 'JR6' | cod_obra ('204OB', 'JAX28', 'OBRA99', 'REPARO')
let WIN = 6;           // janela na tela Evolução (em meses, ou 999 para tudo)
let DATA = { folha: [], fit: [], empresas: [], obras: [], cargos: [], deps: [], rub: [], param: [] };
let FIT_BY_MES = {}; // cache fit por mes_ref (pagamento)
let HIST = {};         // cache: mes -> rows
let CHARTS = {};

// ===== HELPERS =====
const $ = s => document.querySelector(s);
const fmt = {
  brl: v => 'R$ ' + Math.round(v).toLocaleString('pt-BR'),
  brlk: v => 'R$ ' + Math.round(v/1000).toLocaleString('pt-BR') + 'k',
  pct: v => (v*100).toFixed(1) + '%',
  pp: v => (v*100>=0?'+':'') + (v*100).toFixed(1) + ' p.p.',
  num: v => Math.round(v).toLocaleString('pt-BR'),
};
function destroyCharts(){ for (const k in CHARTS){ try{ CHARTS[k].destroy(); } catch(e){} } CHARTS={}; }
function mesLabel(m){ if(!m) return '—'; const [y,mm]=m.split('-'); const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return M[parseInt(mm,10)-1] + '/' + y; }
function mesLabelLong(m){ const [y,mm]=m.split('-'); const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']; return M[parseInt(mm,10)-1] + ' de ' + y; }

// ===== AUTH =====
async function doLogin(){
  const email = $('#li_email').value.trim().toLowerCase();
  const pass = $('#li_pass').value;
  if (!email || !pass) { $('#li_err').textContent = 'Preencha e-mail e senha.'; return; }
  $('#li_err').textContent = 'Entrando…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { $('#li_err').textContent = error.message || 'Não foi possível entrar.'; return; }
  await onSession(data.session);
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function onSession(sess){
  if (!sess) { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }
  USER = sess.user;
  IS_MANAGER = (USER.email || '').toLowerCase() === MANAGER_EMAIL.toLowerCase();
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').innerHTML = USER.email + '<span class="badge ' + (IS_MANAGER?'mgr':'view') + '">' + (IS_MANAGER?'Manager':'Sócio') + '</span>';
  $('#menuWho').innerHTML = '<b>' + USER.email + '</b><br><small style="color:var(--mut)">' + (IS_MANAGER?'Acesso de manager (pode gravar)':'Acesso de leitura') + '</small>';
  if (IS_MANAGER) $('#fab').classList.remove('hidden'); else $('#fab').classList.add('hidden');
  await loadData();
  drawEntPills();
  render();
}

// ===== DATA =====
async function loadData(){
  try {
    const [emp, obr, car, dep, par] = await Promise.all([
      sb.from('empresas').select('*'),
      sb.from('obras').select('*'),
      sb.from('cargos').select('*'),
      sb.from('departamentos').select('*'),
      sb.from('parametros').select('*'),
    ]);
    DATA.empresas = emp.data || [];
    DATA.obras = obr.data || [];
    DATA.cargos = car.data || [];
    DATA.deps = dep.data || [];
    DATA.param = par.data || [];
    const mes = await sb.from('folha_mensal').select('mes_ref');
    const mesFit = await sb.from('fit').select('mes_ref');
    const allMeses = new Set();
    for (const r of (mes.data||[])) allMeses.add(r.mes_ref);
    for (const r of (mesFit.data||[])) allMeses.add(r.mes_ref);
    MESES = [...allMeses].sort().reverse();
    if (!MES) MES = MESES[0] || null;
    fillMesSelect();
    if (MES) { await loadMes(MES); await loadFitMes(MES); }
  } catch (e) { console.error(e); }
}
async function loadMes(m){
  if (HIST[m]) { DATA.folha = HIST[m]; return; }
  const r = await sb.from('folha_mensal').select('*').eq('mes_ref', m);
  HIST[m] = r.data || [];
  DATA.folha = HIST[m];
}
async function fetchMes(m){
  if (HIST[m]) return HIST[m];
  const r = await sb.from('folha_mensal').select('*').eq('mes_ref', m);
  HIST[m] = r.data || [];
  return HIST[m];
}
async function loadFitMes(m){
  if (FIT_BY_MES[m]){ DATA.fit = FIT_BY_MES[m]; return; }
  const r = await sb.from('fit').select('*').eq('mes_ref', m);
  FIT_BY_MES[m] = r.data || [];
  DATA.fit = FIT_BY_MES[m];
}
function fillMesSelect(){
  const sel = $('#mesSel');
  sel.innerHTML = MESES.map(m => `<option value="${m}" ${m===MES?'selected':''}>${mesLabel(m)}</option>`).join('');
  $('#prev').disabled = MESES.indexOf(MES) >= MESES.length - 1;
  $('#next').disabled = MESES.indexOf(MES) <= 0;
}
async function selectMes(m){ MES = m; await loadMes(m); await loadFitMes(m); fillMesSelect(); render(); }
async function step(d){
  const i = MESES.indexOf(MES); const j = i - d;
  if (j < 0 || j >= MESES.length) return;
  MES = MESES[j]; await loadMes(MES); await loadFitMes(MES); fillMesSelect(); render();
}

// ===== ENTIDADES =====
function listEntidades(){
  // Empresas (APEX, JR6) representam suas próprias folhas inteiras.
  // Obras filtram por cod_obra direto, sem migração entre empresas.
  const list = [];
  // APEX e JR6 sempre primeiro
  if (DATA.empresas.find(e=>e.cod_empresa==='1')) list.push({ id:'APEX', label:'APEX', tipo:'empresa' });
  if (DATA.empresas.find(e=>e.cod_empresa==='52')) list.push({ id:'JR6', label:'JR6', tipo:'empresa' });
  // Demais obras (exceto 1AD que é a administração APEX)
  for (const o of DATA.obras){
    if (o.cod_obra === '1AD') continue;
    list.push({ id: o.cod_obra, label: o.apelido || o.nome_obra || o.cod_obra, tipo:'obra' });
  }
  return list;
}
function drawEntPills(){
  const ents = listEntidades();
  $('#entPills').innerHTML = ents.map(e =>
    `<span class="${e.id===ENTIDADE?'on':''}" onclick="setEnt('${e.id}')">${e.label}</span>`
  ).join('');
}
function setEnt(id){ ENTIDADE = id; drawEntPills(); render(); }
function filterByEnt(rows, ent){
  if (!ent) ent = ENTIDADE;
  // Empresa: APEX = cod_empresa 1 (toda a folha APEX, incluindo dep 28 supervisão).
  //          JR6 = cod_empresa 52 (toda a folha JR6).
  if (ent === 'APEX') return rows.filter(r => r.cod_empresa === '1');
  if (ent === 'JR6')  return rows.filter(r => r.cod_empresa === '52');
  // Obra: filtra por cod_obra direto, em qualquer empresa.
  return rows.filter(r => r.cod_obra === ent);
}
function entLabel(){
  const ents = listEntidades();
  return (ents.find(e => e.id === ENTIDADE) || { label: ENTIDADE }).label;
}

// ===== KPIs =====
const INATIVOS = new Set(['Doente','Licenciado','Em','Demitido']);
function custoEncargos(rows){
  // APEX 1AD (administração) usa encargo admin 30%; obras (incluindo JR6) usam 33%.
  let s = 0;
  for (const r of rows){
    const isAdm = r.cod_obra === '1AD';
    const p = +r.proventos_total || 0;
    s += p * (1 + (isAdm ? 0.30 : 0.33));
  }
  return s;
}
function kpisOf(rows){
  const head = rows.length;
  const prov = rows.reduce((a,r)=>a+(+r.proventos_total||0), 0);
  const enc = custoEncargos(rows);
  const inat = rows.filter(r => INATIVOS.has(r.situacao)).length;
  const med = head ? prov / head : 0;
  const sumSalario = rows.reduce((a,r)=>a+(+r.salario_base||0), 0);
  const hoje = new Date();
  let anos = [], idades = [];
  for (const r of rows){
    if (r.dt_admissao){ const d=new Date(r.dt_admissao); if(!isNaN(d)) anos.push((hoje-d)/(365.25*86400000)); }
    if (r.nascimento){ const d=new Date(r.nascimento); if(!isNaN(d)) idades.push((hoje-d)/(365.25*86400000)); }
  }
  const tempo = anos.length ? anos.reduce((a,b)=>a+b,0)/anos.length : 0;
  const idade = idades.length ? idades.reduce((a,b)=>a+b,0)/idades.length : 0;
  return { head, prov, enc, inat, pctInat: head?inat/head:0, med, tempo, idade, sumSalario };
}
function nivelDe(rows){
  const out = {};
  for (const r of rows){
    const c = DATA.cargos.find(x=>x.cod_cargo===r.cod_cargo);
    const n = (c||{}).nivel || '(sem nível)';
    out[n] = (out[n]||0)+1;
  }
  return out;
}
function ratioOS(rows){
  const n = nivelDe(rows);
  const of = (n['Oficial']||0) + (n['Especializado']||0);
  const se = (n['Servente']||0) + (n['Apoio']||0);
  return se ? of/se : 0;
}
function pctAprendizes(rows){
  const n = nivelDe(rows);
  const apr = n['Aprendiz']||0;
  // Base lei do aprendiz: funções que demandam aprendiz
  let baseLei = 0;
  for (const r of rows){
    const c = DATA.cargos.find(x=>x.cod_cargo===r.cod_cargo);
    if (c && c.demanda_aprendiz) baseLei++;
  }
  if (!baseLei) baseLei = rows.length;
  return baseLei ? apr/baseLei : 0;
}
function quartisSalario(rows){
  const vals = rows.map(r=>+r.salario_base||0).filter(v=>v>0).sort((a,b)=>a-b);
  if (!vals.length) return null;
  const q = p => vals[Math.min(vals.length-1, Math.floor(vals.length*p))];
  return { min: vals[0], q25: q(0.25), med: q(0.5), q75: q(0.75), max: vals[vals.length-1] };
}
function turnover(curr, prev){
  if (!curr.length) return { adm:0, dem:0, pct:0 };
  const setC = new Set(curr.map(r=>r.cod_empresa+'|'+r.matricula));
  const setP = new Set(prev.map(r=>r.cod_empresa+'|'+r.matricula));
  let a=0,d=0;
  for (const k of setC) if (!setP.has(k)) a++;
  for (const k of setP) if (!setC.has(k)) d++;
  const hm = (curr.length + prev.length) / 2;
  return { adm:a, dem:d, pct: hm ? (a+d)/2/hm : 0 };
}

function render(){
  destroyCharts();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  if (!MES) { $('#main').innerHTML = '<div class="empty">Nenhum mês carregado.<br>' + (IS_MANAGER?'Toque em <b>+</b> para carregar a primeira folha.':'Solicite ao manager.') + '</div>'; return; }
  if (TAB === 'painel') renderPainel();
  else if (TAB === 'evolucao') renderEvolucao();
  else if (TAB === 'equipe') renderEquipe();
  else if (TAB === 'fit') renderFit();
  else if (TAB === 'mais') renderMais();
}

function renderTopCargos(rows, n){
  const map = {};
  for (const r of rows){
    if (!r.cod_cargo) continue;
    if (!map[r.cod_cargo]) map[r.cod_cargo] = { qtd:0, prov:0 };
    map[r.cod_cargo].qtd++;
    map[r.cod_cargo].prov += (+r.proventos_total||0);
  }
  const arr = Object.entries(map).map(([c,v]) => ({
    nome: ((DATA.cargos.find(x=>x.cod_cargo===c)||{}).nome_cargo) || ('cargo '+c),
    qtd: v.qtd, prov: v.prov,
  })).sort((a,b)=>b.prov-a.prov).slice(0, n);
  if (!arr.length) return '<div class="empty">Sem dados</div>';
  const max = arr[0].prov;
  return arr.map(c => `
    <div style="margin-bottom:9px">
      <div class="bar-lbl"><b>${c.nome}</b><span>${c.qtd} · ${fmt.brlk(c.prov)}</span></div>
      <div class="bar" style="background:linear-gradient(90deg,var(--green) 0%,var(--green) ${(c.prov/max*100).toFixed(0)}%,#EDF0F5 ${(c.prov/max*100).toFixed(0)}%);"></div>
    </div>`).join('');
}
function drawSituacaoChart(rows){

  for (const r of rows){ map[r.situacao] = (map[r.situacao]||0)+1; }
  const labels = Object.keys(map);
  const values = Object.values(map);
  const colors = labels.map(l => l==='Ativo' ? '#1D9E75' : (l==='Doente'?'#E24B4A':(l==='Licenciado'?'#BA7517':'#9AA4B2')));
  const ctx = $('#sitChart');

  CHARTS.sit = new Chart(ctx, {
    type: 'doughnut',

    options: { plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }, cutout: '60%' }
  });
}

// ===== FIT matching (evita duplicação) =====
function normNome(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
function matchFolha(fitName, folhaRows){
  const target = normNome(fitName);
  if (!target) return null;
  // 1. Exato
  for (const f of folhaRows){ if (normNome(f.nome) === target) return f; }
  const tw = target.split(' ').filter(w=>w.length>1);
  if (!tw.length) return null;
  // 2. Todas as palavras do FIT contidas no nome da folha (palavras inteiras)
  for (const f of folhaRows){
    const fwords = normNome(f.nome).split(' ').filter(Boolean);
    if (fwords.length && tw.every(w => fwords.includes(w))) return f;
  }
  // 3. Primeiro + último nome batem
  if (tw.length >= 2){
    const first = tw[0], last = tw[tw.length-1];
    for (const f of folhaRows){
      const fw = normNome(f.nome).split(' ').filter(Boolean);
      if (fw.length >= 2 && fw[0] === first && fw[fw.length-1] === last) return f;
    }
  }
  // 4. Maior overlap de palavras (heurístico, mínimo 2)
  let best = null, bestScore = 0;
  for (const f of folhaRows){
    const fw = normNome(f.nome).split(' ').filter(Boolean);
    const inter = tw.filter(w => fw.includes(w)).length;
    if (inter >= 2 && inter > bestScore){ best = f; bestScore = inter; }
  }
  return best;
}

// ===== FIT (Ficha Interna de Tarefa) =====
function filterFitByEnt(rows, ent){
  if (!ent) ent = ENTIDADE;
  if (ent === 'APEX') return rows; // FIT é tudo APEX
  if (ent === 'JR6') return []; // JR6 não tem FIT
  // Obra: filtra por cod_obra (ou cod_obra_real?). Usar cod_obra (lotação contratual).
  // Mapeamento: cod_obra na planilha pode ser '204', '099', '1PO', etc.
  const obraMap = { '204OB':'204', 'JAX28':'1PO', 'OBRA99':'099', 'REPARO':'REPARO' };
  const codFit = obraMap[ent] || ent;
  return rows.filter(r => (r.cod_obra||'') === codFit);
}

function kpisFit(rows){
  const head = rows.length;
  const total = rows.reduce((a,r)=>a+(+r.total_pago||0), 0);
  const pontos = rows.reduce((a,r)=>a+(+r.valor_pontos||0), 0);
  const variavel = rows.reduce((a,r)=>a+(+r.valor_variavel||0), 0);
  const desc = rows.reduce((a,r)=>a+(+r.desconto||0)+(+r.desconto_mat||0), 0);
  const med = head ? total/head : 0;
  return { head, total, pontos, variavel, desc, med };
}

const FIT_MES_ABREV = {
  JAN:1, FEV:2, MAR:3, ABR:4, MAI:5, JUN:6, JUL:7, AGO:8, SET:9, OUT:10, NOV:11, DEZ:12,
  JANEIRO:1, FEVEREIRO:2, MARCO:3, ABRIL:4, MAIO:5, JUNHO:6, JULHO:7, AGOSTO:8, SETEMBRO:9, OUTUBRO:10, NOVEMBRO:11, DEZEMBRO:12,
};
function parseFitGrid(grid, sheetName, fileName){
  // sheetName tipo "ABR-2026" → mês_referencia = 2026-04, mes_pagamento = 2026-05
  const m = String(sheetName||'').toUpperCase().match(/([A-Z]+)[-_/ ]*(\d{4})/);
  if (!m) throw new Error("Não consegui detectar mês na aba (esperado tipo 'ABR-2026').");
  const monthName = String(m[1]).replace('Ç','C');
  const monthNum = FIT_MES_ABREV[monthName];
  if (!monthNum) throw new Error("Mês desconhecido: " + monthName);
  const year = parseInt(m[2], 10);
  const mesReferencia = year + '-' + String(monthNum).padStart(2,'0');
  // Mês de pagamento = +1 mês
  const pgMonth = monthNum + 1;
  const pgYear = pgMonth > 12 ? year+1 : year;
  const pgM = pgMonth > 12 ? 1 : pgMonth;
  const mesPag = pgYear + '-' + String(pgM).padStart(2,'0');

  // Achar linha de header — varre as primeiras 12 linhas procurando "NOMES" em qualquer coluna.
  let headerRow = -1;
  for (let r=0;r<Math.min(grid.length,12);r++){
    const row = grid[r]||[];
    const hasNome = row.some(c => c!=null && String(c).toUpperCase().trim() === 'NOMES');
    const hasObra = row.some(c => c!=null && String(c).toUpperCase().trim() === 'OBRA');
    if (hasNome && hasObra) { headerRow = r; break; }
  }
  if (headerRow < 0) throw new Error("Cabeçalho não encontrado (col NOMES).");

  // Colunas: c1=A...c27=AA → JS index = c-1
  // Mapeamento por nome de header (mais robusto)
  const headers = (grid[headerRow]||[]).map(x => String(x||'').toUpperCase().trim());
  const idx = label => headers.findIndex(h => h.includes(label));
  const iObra      = idx('OBRA') >= 0 ? headers.findIndex(h=>h==='OBRA') : -1;
  const iLocacao   = headers.findIndex(h=>h.includes('LOCAÇÃO') || h.includes('LOCACAO'));
  const iNome      = headers.findIndex(h=>h.includes('NOME'));
  const iFuncao    = headers.findIndex(h=>h.includes('FUNCAO') || h.includes('FUNÇÃO'));
  const iEquipe    = headers.findIndex(h=>h==='EQUIPE');
  const iSalario   = headers.findIndex(h=>h.includes('SALARIO') || h.includes('SALÁRIO'));
  // Há duas colunas "TOTAL". A primeira (pontos*5) e a segunda (final).
  const totaisIdx = headers.map((h,i)=>h==='TOTAL'?i:-1).filter(x=>x>=0);
  const iPontosVal = totaisIdx[0] !== undefined ? totaisIdx[0] : -1; // primeiro TOTAL = valor de pontos
  const iValor     = headers.findIndex(h=>h==='VALOR');
  const iDesc      = headers.findIndex(h=>h==='DESCONTO');
  const iDescMat   = headers.findIndex(h=>h.includes('MATERIAL') || h.includes('SERVIÇO') || h.includes('SERVICO'));
  const iTotal     = totaisIdx[totaisIdx.length-1]; // último TOTAL = total pago
  const iObs       = headers.findIndex(h=>h.includes('OBSERV'));

  const funcionarios = [];
  for (let r = headerRow+1; r < grid.length; r++){
    const row = grid[r] || [];
    const nome = iNome>=0 ? String(row[iNome]||'').trim() : '';
    if (!nome) continue;
    const total_pago = parseFitNum(row[iTotal]);
    if (!total_pago) continue; // pula linhas sem total
    funcionarios.push({
      cod_obra: iObra>=0 ? String(row[iObra]||'').trim() : null,
      cod_obra_real: iLocacao>=0 ? String(row[iLocacao]||'').trim() : null,
      nome,
      funcao: iFuncao>=0 ? String(row[iFuncao]||'').trim() : null,
      equipe: iEquipe>=0 ? String(row[iEquipe]||'').trim() : null,
      salario: parseFitNum(row[iSalario]),
      valor_pontos: parseFitNum(row[iPontosVal]),
      valor_variavel: parseFitNum(row[iValor]),
      desconto: parseFitNum(row[iDesc]),
      desconto_mat: parseFitNum(row[iDescMat]),
      total_pago,
      observacoes: iObs>=0 ? String(row[iObs]||'').trim() || null : null,
    });
  }
  return { mes_ref: mesPag, mes_referencia: mesReferencia, funcionarios, arquivo_origem: fileName };
}
function parseFitNum(v){ if (v==null || v==='') return null; if (typeof v==='number') return v; const s=String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,''); const n=parseFloat(s); return isNaN(n)?null:n; }

async function onUploadFit(ev){
  if (!IS_MANAGER) return;
  const files = ev.target.files;
  if (!files || !files.length) return;
  const f = files[0];
  try {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:false });
    // Tenta casar nome do arquivo com nome de aba (ex: "Relatório MAR 2026" → aba "MAR-2026")
    const filenameMatch = f.name.toUpperCase().match(/([A-Z]+)\s*[-_/ ]?\s*(\d{4})/);
    let sheetName = wb.SheetNames[wb.SheetNames.length-1]; // padrão: última (mais recente)
    if (filenameMatch){
      const fnMonth = filenameMatch[1].replace('Ç','C').slice(0,3);
      const fnYear = filenameMatch[2];
      const hit = wb.SheetNames.find(sn => {
        const u = sn.toUpperCase().replace('Ç','C');
        return u.includes(fnMonth) && u.includes(fnYear);
      });
      if (hit) sheetName = hit;
    }
    const sheet = wb.Sheets[sheetName];
    const grid = XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval:null });
    const parsed = parseFitGrid(grid, sheetName, f.name);

    // Garante que temos a folha do mês de PAGAMENTO carregada (pra matching)
    const folhaPag = await fetchMes(parsed.mes_ref);

    // Dedup dentro da planilha por nome normalizado:
    //  - se aparecer 2 vezes o mesmo nome, soma os totais e usa o maior salário
    const dedup = new Map();
    for (const p of parsed.funcionarios){
      const k = normNome(p.nome);
      if (!k) continue;
      const prev = dedup.get(k);
      if (!prev){ dedup.set(k, { ...p, _dup: 0 }); continue; }
      // Acumula
      prev.valor_pontos = (prev.valor_pontos||0) + (p.valor_pontos||0);
      prev.valor_variavel = (prev.valor_variavel||0) + (p.valor_variavel||0);
      prev.desconto = (prev.desconto||0) + (p.desconto||0);
      prev.desconto_mat = (prev.desconto_mat||0) + (p.desconto_mat||0);
      prev.total_pago = (prev.total_pago||0) + (p.total_pago||0);
      prev.salario = Math.max(prev.salario||0, p.salario||0);
      prev._dup++;
    }
    const consolidados = Array.from(dedup.values());

    // Matching contra a folha do mês de pagamento → grava matricula + nome_canonico
    const naoCasados = [];
    const rowsToInsert = [];
    const usadasMatriculas = new Set();
    for (const p of consolidados){
      const m = matchFolha(p.nome, folhaPag);
      let matricula = null, nomeCanonico = null;
      if (m){
        matricula = m.matricula;
        nomeCanonico = m.nome;
        // Se essa matricula já apareceu, evita inserir 2 vezes — soma no anterior
        if (usadasMatriculas.has(matricula)){
          const idx = rowsToInsert.findIndex(r => r.matricula === matricula);
          if (idx >= 0){
            const r = rowsToInsert[idx];
            r.valor_pontos = (+r.valor_pontos||0) + (p.valor_pontos||0);
            r.valor_variavel = (+r.valor_variavel||0) + (p.valor_variavel||0);
            r.desconto = (+r.desconto||0) + (p.desconto||0);
            r.desconto_mat = (+r.desconto_mat||0) + (p.desconto_mat||0);
            r.total_pago = (+r.total_pago||0) + (p.total_pago||0);
            continue;
          }
        }
        usadasMatriculas.add(matricula);
      } else {
        naoCasados.push(p.nome);
      }
      rowsToInsert.push({
        mes_ref: parsed.mes_ref,
        mes_referencia: parsed.mes_referencia,
        cod_obra: p.cod_obra, cod_obra_real: p.cod_obra_real,
        nome: nomeCanonico || p.nome,
        funcao: p.funcao, equipe: p.equipe,
        salario: p.salario,
        valor_pontos: p.valor_pontos,
        valor_variavel: p.valor_variavel,
        desconto: p.desconto,
        desconto_mat: p.desconto_mat,
        total_pago: p.total_pago,
        observacoes: p.observacoes,
        arquivo_origem: parsed.arquivo_origem,
        matricula,
        nome_canonico: nomeCanonico,
      });
    }

    // Substituição completa do mês: delete + insert
    await sb.from('fit').delete().eq('mes_ref', parsed.mes_ref);
    if (rowsToInsert.length){
      const res = await sb.from('fit').insert(rowsToInsert);
      if (res.error) throw new Error(res.error.message);
    }
    if (parsed.mes_ref !== MES){
      if (!MESES.includes(parsed.mes_ref)){ MESES.push(parsed.mes_ref); MESES.sort().reverse(); fillMesSelect(); }
      MES = parsed.mes_ref; fillMesSelect(); await loadMes(MES);
    }
    delete FIT_BY_MES[parsed.mes_ref];
    await loadFitMes(parsed.mes_ref);
    render();

    let msg = `FIT carregado: ${rowsToInsert.length} pessoas · ${fmt.brl(rowsToInsert.reduce((a,r)=>a+(+r.total_pago||0),0))}\nPagamento em ${mesLabel(parsed.mes_ref)} (referente a ${mesLabel(parsed.mes_referencia)})`;
    if (naoCasados.length){
      msg += `\n\n${naoCasados.length} nome(s) sem vínculo com a folha do mês (admin, externo, ou grafia diferente):\n` + naoCasados.slice(0,10).map(n=>'• '+n).join('\n');
      if (naoCasados.length > 10) msg += `\n… e mais ${naoCasados.length-10}`;
      msg += '\n\nForam mantidos. Se notar duplicação, verifique a grafia no Excel.';
    }
    alert(msg);
  } catch (e){
    alert('Erro ao carregar FIT: ' + (e.message||e));
    console.error(e);
  }
  ev.target.value = '';
}

async function onUpload(ev){

  if (!files || !files.length) return;
  const status = $('#uploadStatus'); status.innerHTML = '';
  for (const f of files){
    status.innerHTML += `<div class="line"><span>${f.name}</span><span class="v" id="st_${f.name.replace(/[^a-z0-9]/gi,'_')}">processando…</span></div>`;
  }

    const sid = 'st_' + f.name.replace(/[^a-z0-9]/gi,'_');
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: false });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });

      $('#'+sid).style.color = 'var(--green)';
    } catch (e) {
      $('#'+sid).textContent = '✗ ' + (e.message||'erro');
      $('#'+sid).style.color = 'var(--red)';
    }
  }
  HIST = {};
  await loadData();
  if (MES) await loadMes(MES);
  render();
}
function parseAnalitico(grid, fileName){
  const MESES_PT = {JANEIRO:1,FEVEREIRO:2,MARCO:3,ABRIL:4,MAIO:5,JUNHO:6,JULHO:7,AGOSTO:8,SETEMBRO:9,OUTUBRO:10,NOVEMBRO:11,DEZEMBRO:12};
  const strip = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  let mes_ref=null, empresa={}, obra={}, funcStartRows=[];
  for (let r=0;r<grid.length;r++){
    const row = grid[r]||[]; const text = row.map(x=>String(x||'')).join(' ');
    if (!mes_ref){
      const m = strip(text).match(/FOLHA ANAL[ÍI]TICA\s*-\s*([A-Z]+)\s*\/\s*(\d{4})/);
      if (m){ const M=MESES_PT[strip(m[1])]; if (M) mes_ref = m[2]+'-'+String(M).padStart(2,'0'); }
    }
    if (row[0]==='Empresa:'){
      const cod = String(row[3]||'').replace(/\.0$/,'');
      const razao = String(row[4]||'').trim();
      let cnpj=''; for(let c=0;c<row.length;c++) if(row[c]==='CNPJ:'){ cnpj=String(row[c+1]||'').trim(); break; }
      empresa = { cod_empresa: cod, razao_social: razao, cnpj };
    } else if (row[0]==='Obra:'){
      const cod = String(row[3]||'').trim(); const nome = String(row[4]||'').trim();
      let cnpj_cno=''; for(let c=0;c<row.length;c++) if(row[c]==='CNPJ/CNO:'){ cnpj_cno=String(row[c+1]||'').trim(); break; }
      obra = { cod_obra: cod, nome_obra: nome, cnpj_cno };
    } else if (row[0]==='Funcionário:') funcStartRows.push(r);
  }
  const funcionarios=[];
  for (let i=0;i<funcStartRows.length;i++){
    const f = parseBloco(grid, funcStartRows[i], funcStartRows[i+1]||grid.length);
    if (f) funcionarios.push(f);
  }
  return { mes_ref, empresa, obra, funcionarios, arquivo_origem: fileName };
}
function parseBloco(grid, r0, rEnd){
  const row0 = grid[r0]||[];
  let matricula='', lastIdx=-1;
  for (let c=1;c<row0.length;c++) if (row0[c]){ matricula=String(row0[c]).replace(/\.0$/,''); lastIdx=c; break; }
  let nome='';
  for (let c=lastIdx+1;c<row0.length;c++) if (row0[c]){ nome=String(row0[c]).trim(); break; }
  let situacao='Ativo';
  for (const v of row0){
    if (v && String(v).includes('Situação:')){
      const m = String(v).match(/Situa[cç][aã]o:\s*\d+\s*(\w+)/);
      if (m) situacao = m[1]; break;
    }
  }
  if (!matricula || !nome) return null;
  const f = { matricula, nome, situacao, cpf:null, pis:null, nascimento:null, dt_admissao:null, dt_demissao:null,
    cod_departamento:null, nome_departamento:'', cod_cargo:null, nome_cargo:'', cod_funcao:null, nome_funcao:'',
    salario_base:0, proventos_total:0, descontos_total:0, liquido:0,
    base_inss:0, base_fgts:0, fgts:0, base_irrf:0, dependentes_ir:0, cod_obra:null };
  for (let r=r0+1;r<rEnd;r++){
    const row=grid[r]||[]; const txt=row.map(x=>String(x||'')).join(' ');
    if (row[0]==='Nascimento:'){
      f.nascimento = parseDate(row[3]);
      const aft = lab => { for(let c=0;c<row.length;c++) if(row[c]===lab){ for(let k=c+1;k<row.length;k++) if(row[k]) return row[k]; } return null; };
      f.cpf = onlyDigits(aft('CPF:')); f.pis = onlyDigits(aft('PIS:'));
      const di = aft('Dependente IR:'); f.dependentes_ir = parseInt(di||'0',10) || 0;
    } else if (row[0]==='Dt. admissão:'){
      f.dt_admissao = parseDate(row[3]);
      let demIdx=-1, depIdx=-1;
      for (let c=0;c<row.length;c++){ if(row[c]==='Dt. demissão:') demIdx=c; if(row[c]==='Departamento:') depIdx=c; }
      if (depIdx>0){
        for (let c=depIdx-1;c>demIdx;c--){ const v=row[c]; if (v!=null && !isNaN(+String(v).replace(/\./g,''))){ f.cod_departamento=String(v).replace(/\.0$/,''); break; } }
        for (let c=depIdx+1;c<row.length;c++) if (row[c]){ f.nome_departamento=String(row[c]).trim(); break; }
      }
    } else if (row[0]==='Salário:'){
      f.salario_base = parseNum(row[3]);
      let cargoIdx=-1, funcaoIdx=-1;
      for (let c=0;c<row.length;c++){ if(row[c]==='Cargo:') cargoIdx=c; if(row[c]==='Função:') funcaoIdx=c; }
      if (cargoIdx>0){
        for (let c=cargoIdx+1;c<row.length;c++) if(row[c]){ f.nome_cargo=String(row[c]).trim(); break; }
        for (let c=cargoIdx-1;c>0;c--){ const v=row[c]; if (v!=null && !isNaN(+String(v).replace(/\./g,'')) && +v !== +row[3]){ f.cod_cargo=String(v).replace(/\.0$/,''); break; } }
      }
      if (funcaoIdx>0) for (let c=funcaoIdx+1;c<row.length;c++) if(row[c]){ f.nome_funcao=String(row[c]).trim(); break; }
    } else if (txt.includes('Proventos:') && txt.includes('Descontos:')){
      f.proventos_total = parseNum(findAfter(row,'Proventos:'));
      f.descontos_total = parseNum(findAfter(row,'Descontos:'));
    } else if (txt.includes('LÍQUIDO:')){
      f.liquido = parseNum(findAfter(row,'LÍQUIDO:'));
    } else if (txt.includes('Base INSS:') && txt.includes('Base FGTS:')){
      f.base_inss = parseNum(findAfter(row,'Base INSS:'));
      f.base_fgts = parseNum(findAfter(row,'Base FGTS:'));
      f.fgts = parseNum(findAfter(row,'FGTS:'));
    } else if (txt.includes('Base IRRF:')){
      f.base_irrf = parseNum(findAfter(row,'Base IRRF:'));
    }
  }
  return f;
}
function findAfter(row,lab){ for(let c=0;c<row.length;c++) if(row[c]===lab){ for(let k=c+1;k<row.length;k++) if(row[k]) return row[k]; } return null; }
function parseNum(v){ if(v==null) return 0; if(typeof v==='number') return v; const s=String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,''); const n=parseFloat(s); return isNaN(n)?0:n; }
function parseDate(v){ if(!v) return null; if(v instanceof Date) return v.toISOString().split('T')[0]; const s=String(v).trim(); const m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3]+'-'+m[2]+'-'+m[1] : null; }
function onlyDigits(v){ const s=String(v||'').replace(/\D/g,''); return s||null; }

async function upsertFolha(parsed){
  const codEmp = parsed.empresa.cod_empresa;
  const codObra = (parsed.obra||{}).cod_obra || null;
  await sb.from('empresas').upsert({ cod_empresa: codEmp, razao_social: parsed.empresa.razao_social, nome_curto: parsed.empresa.razao_social.slice(0,20), cnpj: parsed.empresa.cnpj }, { onConflict:'cod_empresa', ignoreDuplicates:true });
  if (codObra) await sb.from('obras').upsert({ cod_obra: codObra, nome_obra: parsed.obra.nome_obra||codObra, cnpj_cno: parsed.obra.cnpj_cno, empresa_responsavel: codEmp, status:'Em execução' }, { onConflict:'cod_obra', ignoreDuplicates:true });
  const cargosSet={}, depsSet={};
  for (const f of parsed.funcionarios){
    if (f.cod_cargo && !cargosSet[f.cod_cargo]) cargosSet[f.cod_cargo] = f.nome_cargo || f.cod_cargo;
    if (f.cod_departamento && !depsSet[f.cod_departamento]) depsSet[f.cod_departamento] = f.nome_departamento || f.cod_departamento;
  }
  if (Object.keys(cargosSet).length) await sb.from('cargos').upsert(Object.entries(cargosSet).map(([c,n])=>({cod_cargo:c, nome_cargo:n, nivel:'Oficial', categoria:'Operacional', demanda_aprendiz:false})), { onConflict:'cod_cargo', ignoreDuplicates:true });
  if (Object.keys(depsSet).length) await sb.from('departamentos').upsert(Object.entries(depsSet).map(([c,n])=>({cod_empresa:codEmp, cod_departamento:c, nome_departamento:n, tipo:'ADM'})), { onConflict:'cod_empresa,cod_departamento', ignoreDuplicates:true });
  const rows = parsed.funcionarios.map(f=>({
    mes_ref: parsed.mes_ref, cod_empresa: codEmp, matricula: f.matricula,
    nome: f.nome, cpf: f.cpf, pis: f.pis,
    nascimento: f.nascimento, dt_admissao: f.dt_admissao, dt_demissao: f.dt_demissao,
    situacao: f.situacao, cod_departamento: f.cod_departamento,
    cod_obra: f.cod_obra || codObra, cod_cargo: f.cod_cargo, cod_funcao: f.cod_funcao,
    salario_base: f.salario_base, proventos_total: f.proventos_total,
    descontos_total: f.descontos_total, liquido: f.liquido,
    base_inss: f.base_inss, base_fgts: f.base_fgts, fgts: f.fgts, base_irrf: f.base_irrf,
    dependentes_ir: f.dependentes_ir, arquivo_origem: parsed.arquivo_origem,
  }));
  const res = await sb.from('folha_mensal').upsert(rows, { onConflict:'mes_ref,cod_empresa,matricula' });
  if (res.error) throw new Error(res.error.message);
  return { rows: rows.length };
}

function pdfHeader(doc, titulo, subtitulo){
  doc.setFillColor(31,56,100); doc.rect(0, 0, 210, 22, 'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('GRUPO APEX — RECURSOS HUMANOS', 14, 10);
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(titulo + ' · ' + subtitulo, 14, 17);
  doc.setTextColor(0);
  doc.setFontSize(9); doc.text('Gerado em ' + new Date().toLocaleString('pt-BR'), 150, 17);
}
function exportarPDFPainel(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHeader(doc, 'Painel de RH · ' + entLabel(), mesLabelLong(MES));
  const rows = filterByEnt(DATA.folha);
  const k = kpisOf(rows);
  const ratio = ratioOS(rows); const apr = pctAprendizes(rows);
  doc.autoTable({
    startY: 30,
    head: [['Indicador','Valor']],
    body: [
      ['Pessoas', fmt.num(k.head)],
      ['Folha bruta', fmt.brl(k.prov)],
      ['Custo com encargos (33% obra / 30% admin)', fmt.brl(k.enc)],
      ['% Inativos', fmt.pct(k.pctInat)],
      ['Custo médio por pessoa', fmt.brl(k.med)],
      ['Tempo médio de casa', k.tempo.toFixed(1) + ' anos'],
      ['Idade média', k.idade.toFixed(0) + ' anos'],
      ['Ratio Oficial : Servente', ratio.toFixed(2)],
      ['% Aprendizes (Lei do Aprendiz)', fmt.pct(apr)],
    ],
    styles:{ fontSize:10 }, headStyles:{ fillColor:[31,56,100] },
  });
  // Top cargos
  const map = {};
  for (const r of rows){ if(!r.cod_cargo) continue; if(!map[r.cod_cargo]) map[r.cod_cargo]={q:0,p:0}; map[r.cod_cargo].q++; map[r.cod_cargo].p+=+r.proventos_total||0; }
  const top = Object.entries(map).map(([c,v])=>({nome:(DATA.cargos.find(x=>x.cod_cargo===c)||{}).nome_cargo||c, q:v.q, p:v.p})).sort((a,b)=>b.p-a.p).slice(0,15);
  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 8,
    head:[['Top cargos por custo','Qtd','Folha bruta']],
    body: top.map(t=>[t.nome, t.q, fmt.brl(t.p)]),
    styles:{ fontSize:9 }, headStyles:{ fillColor:[31,56,100] },
  });
  doc.save(`apex-rh-painel-${ENTIDADE}-${MES}.pdf`);
}
function exportarPDFEquipe(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHeader(doc, 'Equipe · ' + entLabel(), mesLabelLong(MES));
  const f = EQ_FILTER ? EQ_FILTER.toLowerCase() : '';
  let rows = filterByEnt(DATA.folha);
  if (f) rows = rows.filter(r => (r.nome||'').toLowerCase().includes(f) || (r.matricula||'').toString().includes(f) || ((DATA.cargos.find(c=>c.cod_cargo===r.cod_cargo)||{}).nome_cargo||'').toLowerCase().includes(f));
  rows.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  doc.setFontSize(10); doc.text(`Total: ${rows.length} pessoas`, 14, 28);
  doc.autoTable({
    startY: 32,
    head: [['Mat.','Nome','Cargo','Situação','Admissão','Sal. base']],
    body: rows.map(r => [
      r.matricula,
      r.nome || '',
      (DATA.cargos.find(c=>c.cod_cargo===r.cod_cargo)||{}).nome_cargo || ('cargo '+(r.cod_cargo||'?')),
      r.situacao || '',
      r.dt_admissao ? r.dt_admissao.split('-').reverse().join('/') : '',
      fmt.brl(+r.salario_base||0),
    ]),
    styles:{ fontSize:8 }, headStyles:{ fillColor:[31,56,100] },
    columnStyles: { 5: { halign:'right' }, 0: { halign:'right' } },

  doc.save(`apex-rh-equipe-${ENTIDADE}-${MES}.pdf`);
}
async function exportarPDFEvolucao(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHeader(doc, 'Evolução · ' + entLabel(), `${WIN>=999?'Todo período':WIN+' meses'} até ${mesLabel(MES)}`);
  const idx = MESES.indexOf(MES);
  const mesesJanela = (WIN>=999 ? MESES.slice(idx) : MESES.slice(idx, idx+WIN)).reverse();
  const series = [];
  for (const m of mesesJanela){
    const rows = filterByEnt(await fetchMes(m));
    series.push({ m, k: kpisOf(rows) });
  }
  doc.autoTable({
    startY: 30,
    head: [['Mês','Pessoas','Folha bruta','C/ encargos','% Inativos','Custo médio']],
    body: series.map(s => [
      mesLabel(s.m), s.k.head, fmt.brl(s.k.prov), fmt.brl(s.k.enc), fmt.pct(s.k.pctInat), fmt.brl(s.k.med)
    ]),
    styles:{ fontSize:9 }, headStyles:{ fillColor:[31,56,100] },
    columnStyles: { 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'}, 4:{halign:'right'}, 5:{halign:'right'} },
  });
  doc.save(`apex-rh-evolucao-${ENTIDADE}-${MES}.pdf`);
}
